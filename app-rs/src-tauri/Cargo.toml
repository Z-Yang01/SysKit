[package]
name = "syskit-rs"
version = "1.2.0"
description = "SysKit 系统工具箱（Rust + Tauri 重写版）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "syskit_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建（tauri build / cargo build --release --features custom-protocol）
# 必须启用：否则应用退回 devUrl（localhost:5173）——真机实测 ERR_CONNECTION_REFUSED
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = { version = "0.4", features = ["std"] }
# 规则名身份键：`SysKit-AppNet-<sha1(norm_path)[:10]>` 必须与 Python 版逐字节一致，
# 否则同一个 exe 会被两个版本各建一条规则（用户在 wf.msc 里看到重复项）。
# 用 crate 而不是手写 SHA-1：摘要是密码学原语，手写不出错很难、出错很难发现。
sha1 = "0.10"
# 密码库数据层（M6）：bundled=自带 SQLite C 源（免系统 dll 依赖）；同库互开
# 是跨语言硬约束，schema/SQL 逐字对齐 syskit/vault.py
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinInet",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
