[package]
name = "syskit-rs"
version = "1.2.0"
description = "SysKit 系统工具箱（Rust + Tauri 重写版）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "syskit_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
