[pytest]
testpaths = tests
addopts = -q
; QT_QPA_PLATFORM=offscreen 在 conftest.py 顶部设置（须早于 QApplication 创建）
; 全局硬超时：命令行漏写 --timeout 时，卡死的用例（真实模态弹窗、等不到的线程）
; 也必须在一分钟内出结果而不是挂满整个会话；离群慢例（曾有一条 42s 的递归扫盘）
; 由 120s 兜住，个别确需更长的用例自行 @pytest.mark.timeout 覆盖。
timeout = 120
qt_api = pyside6
markers =
    real: 真机冒烟（向真实桌面注入按键；仅 tools/test_smoke_real.py 使用，需 --run-real 且人工在场）
